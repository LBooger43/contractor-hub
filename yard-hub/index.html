<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yard Hub Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111111;--navy:#161616;--navy2:#2B2B2B;--blue:#FFC20E;--blueD:#8A6500;--sky:#FFD54A;--ice:#FFF5D1;--bg:#FAF8F2;--line:#E4E1D8;--line2:#D3CFC2;--muted:#5A5850}
  *{box-sizing:border-box}
  html,body{margin:0;background:#E8E5DC;font-family:'Barlow',sans-serif;color:var(--ink)}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .bar{max-width:390px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff}
  .bar b{font-family:'Barlow Condensed',sans-serif;font-size:19px;flex:1;letter-spacing:.02em}
  .seg{display:flex;background:#2A2A2A;border-radius:999px;padding:3px}
  .seg button{border:none;background:none;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;min-height:32px}
  .seg button.on{background:var(--blue);color:#111111}
  .restart{width:40px;height:40px;border-radius:20px;border:none;background:#fff;color:#111;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hint{max-width:390px;margin:0 auto;background:var(--sky);padding:9px 16px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
  .hint .who{background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:3px 8px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .phone{max-width:390px;min-height:760px;margin:0 auto 30px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:500px){.bar{margin-top:20px;border-radius:20px 20px 0 0}.phone{border-radius:0 0 32px 32px;box-shadow:0 20px 50px rgba(10,15,26,.25)}}
  .pad{padding:20px;display:flex;flex-direction:column;gap:16px;flex:1}
  .h{font-family:'Barlow Condensed',sans-serif;font-weight:800;margin:0;line-height:1.05;letter-spacing:.01em}
  .muted{color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  button.card{width:100%;text-align:left;font-size:inherit}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;justify-content:space-between;align-items:center}
  .chip{font-size:13px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap}
  .c-paid{background:#DCF3E6;color:#11643C}.c-wait{background:#FFF0C9;color:#7A4F00}.c-over{background:#FDE2E4;color:#A3152A}.c-est{background:var(--ice);color:var(--blueD)}
  .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .big{height:58px;border-radius:14px;border:none;width:100%;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px}
  .bluebtn{background:var(--blue);color:#111111;box-shadow:0 4px 0 var(--blueD)}
  .blackbtn{background:var(--ink);color:#fff;box-shadow:0 4px 0 #000}
  .ghost{background:#fff;border:2px solid var(--ink);font-size:17px;height:52px}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--ink);padding:8px 8px 18px;margin-top:auto}
  .tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;font-size:12px;font-weight:700;color:#A8A390;position:relative}
  .tabs button.on{color:var(--sky);font-weight:800}
  .badge{position:absolute;top:0;right:22%;background:var(--blue);color:#111111;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);text-align:left}
  .opt.on{background:var(--ice);border-color:var(--blue)}
  .dot{width:20px;height:20px;border-radius:10px;border:2px solid #AAA592;flex-shrink:0}
  .opt.on .dot{border:6px solid var(--blue)}
  .mat{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);text-align:left;min-height:52px}
  .mat.on{border-color:var(--navy)}
  .box{width:22px;height:22px;border-radius:6px;border:2px solid #AAA592;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .mat.on .box{background:var(--navy);border-color:var(--navy)}
  .pill{min-height:44px;padding:0 14px;border-radius:999px;font-weight:800;font-size:14px;background:#fff;border:2px solid var(--line2)}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .switch{width:56px;height:32px;border-radius:16px;border:none;padding:3px;display:flex;background:#CEC8B6;flex-shrink:0}
  .switch.on{background:var(--blue);justify-content:flex-end}
  .switch span{width:26px;height:26px;border-radius:13px;background:#fff;display:block}
  .stepper{display:flex;align-items:center;border:2px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
  .stepper button{width:44px;height:44px;border:none;background:#fff;font-size:22px;font-weight:800}
  .stepper b{min-width:44px;text-align:center;font-family:'Barlow Condensed';font-size:22px}
  textarea{font-family:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;resize:none;width:100%}
  .foot{background:#fff;border-top:1px solid var(--line);padding:14px 20px 22px;display:flex;align-items:center;gap:14px}
  .sheetWrap{position:absolute;inset:0;background:rgba(10,15,26,.6);display:flex;align-items:flex-end}
  .sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:28px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;overflow:hidden}
  .link{background:none;border:none;color:#8A6500;font-weight:800;font-size:15px;padding:10px;min-height:44px}
  .line{display:flex;justify-content:space-between;font-size:15px;gap:10px}
  .conf{position:absolute;display:block;pointer-events:none}
  .days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .day{min-height:58px;border-radius:12px;border:2px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .day small{font-size:12px;font-weight:700}.day b{font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1}
  .day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-left:20px;padding-right:20px}
  .crew{min-height:44px;border-radius:999px;border:2px solid var(--line2);background:#fff;padding:0 12px 0 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap}
  .crew.on{border-color:var(--ink);background:var(--ice)}
  .av{width:30px;height:30px;border-radius:15px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;flex-shrink:0}
  .stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{border-radius:14px;padding:10px 12px}
  .stat small{display:block;font-size:12px;font-weight:800}.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1.1}
  .step{display:flex;gap:12px;min-height:54px}
  .step .rail{display:flex;flex-direction:column;align-items:center;width:24px}
  .step .bead{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step .stem{flex:1;width:3px;background:var(--line2)}
  .toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--blue);color:#111111;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;text-align:center;z-index:5}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .photo{border-radius:12px;overflow:hidden;position:relative;aspect-ratio:4/3}
  .photo span{position:absolute;left:8px;top:8px;background:rgba(10,15,26,.8);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .timer{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
  .live{width:10px;height:10px;border-radius:5px;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.25);flex-shrink:0}
  .off{width:10px;height:10px;border-radius:5px;background:#AAA592;flex-shrink:0}
  .segw{display:grid;grid-template-columns:1fr 1fr;background:#ECE8DC;border-radius:12px;padding:4px}
  .segw button{border:none;background:none;min-height:44px;border-radius:9px;font-weight:800;font-size:15px}
  .segw button.on{background:var(--ink);color:#fff}
  .fld{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
  .scan{position:absolute;left:0;right:0;height:4px;background:var(--sky);box-shadow:0 0 14px 4px rgba(124,192,255,.8);animation:scan 1.4s ease-in-out infinite}
  @keyframes scan{0%{top:0}50%{top:calc(100% - 4px)}100%{top:0}}
  .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
</style>
</head>

  <div class="days">${days.map((d,i)=>`<button class="day ${S.day===d?'on':''}" data-act="day" data-v="${d}" aria-pressed="${S.day===d}"><small>${t.days[i]}</small><b>${d}</b></button>`).join('')}</div>
  <div class="scroller">
    <button class="crew ${S.who==='all'?'on':''}" data-act="who" data-v="all" style="padding-left:14px">${t.everyone}</button>
    ${CREW.map(c=>`<button class="crew ${S.who===c.id?'on':''}" data-act="who" data-v="${c.id}" aria-pressed="${S.who===c.id}">${av(c.id)}${c.n} <span class="muted" style="font-weight:700">${t.hrs(hours[c.id])}</span></button>`).join('')}
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    ${jobs.length?jobs.map(j=>`<div class="card row" style="align-items:flex-start;border-left:4px solid var(--blue)">
      <div style="width:58px;flex-shrink:0"><div class="h" style="font-size:19px">${j.t.split(' ')[0]}</div><div class="muted" style="font-size:12px;font-weight:800">${j.t.split(' ')[1]}</div></div>
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">${j.c}</div><div style="font-size:14px;font-weight:600">${j.j}</div><div class="muted" style="font-size:13px">${j.a} · ${t.hours(j.h)}</div>
        <div class="row" style="gap:8px;margin-top:8px"><span class="stack" style="display:flex">${j.crew.map(av).join('')}</span><span style="font-size:13px;font-weight:700">${j.crew.map(id=>crewOf(id).n).join(' + ')}</span></div>${calLink(j,S.day)}<br>${j.rep?`<span class="chip" style="display:inline-block;margin-top:8px;margin-right:6px;font-size:12px;padding:4px 9px;background:#E3F1D6;color:#2F5212">↻ ${j.rep==='w'?t.repW:t.repB}</span>`:''}${j.sub?`<span class="chip c-est" style="display:inline-block;margin-top:8px;font-size:12px;padding:4px 9px">${t.subLbl}: ${j.sub}</span>`:''}</div>
    </div>`).join(''):`<div class="card muted" style="text-align:center;padding:24px">${t.noJobs}</div>`}
  </div>
  <button class="big blackbtn" style="font-size:19px;height:54px;margin-top:4px" data-act="toast" data-v="textedCrew">${icon.send('#fff')}${t.textCrew}</button>
</div>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}${tabs(t,'schedule')}`}

function bills(t){
  const tt=totals();
  const list=S.bills.filter(b=>S.filter==='all'||(S.filter==='paid'&&b.status==='paid')||(S.filter==='est'&&isEst(b))||(S.filter==='waiting'&&b.status!=='paid'&&!isEst(b))).slice().sort((a,b)=>b.d-a.d);
  const f=[['all',t.all],['est',t.estimatesW],['waiting',t.waitingW],['paid',t.paidW]];
  return `
<div class="pad" style="padding-top:24px;gap:14px">
  <h1 class="h" style="font-size:32px">${t.bills.toUpperCase()}</h1>
  <div class="segw" role="group" style="grid-template-columns:repeat(3,1fr)">${[['inv',t.invTab],['pnl',t.pnlTab],['pf',t.pfTab]].map(([k,l])=>`<button class="${(S.moneyTab||'inv')===k?'on':''}" data-act="moneyTab" data-v="${k}" style="font-size:14px;line-height:1.1;padding:4px">${l}</button>`).join('')}</div>
  ${S.moneyTab==='pnl'?pnl(t):S.moneyTab==='pf'?pfView(t):`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button class="big bluebtn" style="height:50px;font-size:18px" data-act="newInv">+ ${t.newInvoice}</button>
    <button class="big blackbtn" style="height:50px;font-size:18px" data-act="newEst" data-v="bills">+ ${t.newEst}</button></div>
  <div class="stats">
    <div class="stat c-paid"><small>${t.paidW}</small><b>${whole(tt.pS)}</b></div>
    <div class="stat c-wait"><small>${t.waitingW}</small><b>${whole(tt.wS)}</b></div>
    <div class="stat c-over"><small>${t.overdueW}</small><b>${whole(tt.oS)}</b></div>
  </div>
  <div class="scroller" style="gap:8px">${f.map(([k,l])=>`<button class="pill ${S.filter===k?'on':''}" data-act="filter" data-v="${k}" aria-pressed="${S.filter===k}" style="flex-shrink:0">${l}</button>`).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    ${list.length?list.map(b=>`<button class="card row" data-act="openBill" data-v="${b.id}" style="${(b.id==='hendersons'||b.id==='oakb')&&b.status!=='paid'?'border:2px solid var(--blue)':''}">
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">${b.client}</div>
        <div style="font-size:13px;font-weight:600">${b.job}</div>
        <div class="muted" style="font-size:13px">${t.mon(b.d)} · ${lastEv(b,t)}</div></div>
      <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="h" style="font-size:20px">${money(b.amount)}</span>${isProg(b)?`<span class="muted" style="font-size:12px;font-weight:700">${t.balLeft(whole(b.amount-msPaidSum(b)))}</span>`:''}${stChip(b,t)}</div>
    </button>`).join(''):`<div class="card muted" style="text-align:center;padding:24px">${t.noBills}</div>`}
  </div>
  <button class="big ghost" data-act="copy"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10 H21 M3 15 H21 M9 4 V20 M15 4 V20"/></svg>${t.copy}</button>`}
</div>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}${tabs(t,'bills')}`}
const evLabel=(k,t)=>({partial:t.ev_partial,progress:t.ev_progress,est:t.ev_est,approved:t.ev_approved,deposit:t.ev_deposit,sent:t.ev_sent,opened:t.ev_opened,reminder:t.ev_reminder,paid:t.ev_paid})[k];
const lastEv=(b,t)=>{const e=b.ev[b.ev.length-1];return `${evLabel(e[0],t)} ${e[2]}`};
const methodName=(m,t)=>({apple:t.applePay,google:t.googlePay,bank:t.ach,cash:t.cash,card:t.creditCard})[m]||'';

function progDetail(t,b){
  const pd=msPaidSum(b), pct=Math.round(pd/b.amount*100);
  const openM=b.ms.find(m=>m.st==='partial'||m.st==='sent');
  const msChip=m=>m.st==='paid'?`<span class="chip c-paid" style="font-size:12px;padding:4px 9px">${t.msPaid(m.date)}</span>`:m.st==='partial'?`<span class="chip c-wait" style="font-size:12px;padding:4px 9px">${t.msPartial(whole(m.paid),whole(m.amt))}</span>`:m.st==='sent'?`<span class="chip c-wait" style="font-size:12px;padding:4px 9px">${t.msSent}</span>`:m.st==='ready'?`<span class="chip c-est" style="font-size:12px;padding:4px 9px">${t.msReady}</span>`:`<span class="chip" style="font-size:12px;padding:4px 9px;background:#ECEAE2;color:#5A5850">${t.msLater}</span>`;
  return `
<div class="row" style="padding:16px 16px 4px 12px;gap:6px">
  <button data-act="go" data-v="bills" aria-label="${t.backBills}" style="width:44px;height:44px;border:none;background:none">${icon.back}</button>
  <span style="font-weight:800">${t.backBills}</span>
</div>
<div class="pad" style="padding-top:4px;gap:14px">
  <div style="border-radius:18px;padding:18px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;gap:6px">
    <div class="between"><span style="font-weight:800;font-size:18px">${b.client}</span>${stChip(b,t)}</div>
    <span style="font-weight:600;color:#E8E2CC">${b.job} · 4 wks</span>
    <div class="between" style="margin-top:6px;align-items:flex-end"><div><div style="font-size:12px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:.06em">${t.paidSoFar}</div><div class="h" style="font-size:38px">${money(pd)}</div></div>
      <div style="text-align:right"><div style="font-size:12px;font-weight:700;color:#E8E2CC">${t.contract}</div><div class="h" style="font-size:20px">${money(b.amount)}</div></div></div>
    <div style="height:10px;border-radius:5px;background:#3A3A3A;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--sky)"></div></div>
    <div class="between" style="font-size:13px;font-weight:700"><span>${pct}%</span><span>${t.balance}: ${money(b.amount-pd)}</span></div>
  </div>
  <h2 class="h" style="font-size:22px">${t.paySched.toUpperCase()}</h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    ${b.ms.map((m,i)=>`<div class="card" style="display:flex;flex-direction:column;gap:8px;${m.st==='ready'?'border:2px solid var(--blue)':''}">
      <div class="row"><span class="h" style="width:30px;height:30px;border-radius:15px;background:${m.st==='paid'?'#11643C':m.st==='later'?'#CEC8B6':'var(--blue)'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${m.st==='paid'?icon.check():i+1}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:800">${t[m.k]}</div><div class="muted" style="font-size:13px">${m.pct}%</div></div><span class="h" style="font-size:20px">${money(m.amt)}</span></div>
      <div>${msChip(m)}</div>
      ${m.st==='ready'?`<button class="big bluebtn pulse" style="height:50px;font-size:18px" data-act="sendMs" data-v="${i}">${icon.send('#fff')}${t.sendMs(whole(m.amt))}</button>`:''}
      ${m.st==='partial'||m.st==='sent'?`<button class="pill" style="align-self:flex-start" data-act="remindMs" data-v="${i}">${t.remindRest(whole(m.amt-m.paid))}</button>`:''}
    </div>`).join('')}
  </div>
  ${openM?`<button class="big ghost" data-act="recordMs">${t.recordPay(whole(openM.amt-openM.paid))}</button>`:''}
</div>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}${tabs(t,'bills')}`}

function billDetail(t){
  const b=S.bills.find(x=>x.id===S.billId);
  if(isProg(b)) return progDetail(t,b);
  const steps=[...b.ev];
  if(b.status==='estimate') steps.push(['approved',null,null]);
  if(b.status!=='paid') steps.push(['paid',null,null]);
  return `
<div class="row" style="padding:16px 16px 4px 12px;gap:6px">
  <button data-act="go" data-v="bills" aria-label="${t.backBills}" style="width:44px;height:44px;border:none;background:none">${icon.back}</button>
  <span style="font-weight:800">${t.backBills}</span>
</div>
<div class="pad" style="padding-top:4px;gap:16px">
  <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;border-top:4px solid var(--blue)">
    <div class="between" style="width:100%"><span style="font-weight:800;font-size:18px">${b.client}</span>${stChip(b,t)}</div>
    <span style="font-weight:600">${b.job}</span>
    <span class="h" style="font-size:42px">${money(b.amount)}</span>
    <span class="muted" style="font-size:14px">${t.mon(b.d)}${b.deposit?` · ${t.ev_deposit} ${money(b.deposit)}`:''}${b.method?` · ${methodName(b.method,t)}`:''}</span>
  </div>
  <div aria-label="History">
    ${steps.map((e,i)=>{const done=!!e[2];const last=i===steps.length-1;
      const col=!done?'#CEC8B6':e[0]==='paid'?'#11643C':e[0]==='reminder'?'#A3152A':e[0]==='opened'?'#111111':'#FFC20E';
      return `<div class="step"><div class="rail"><span class="bead" style="background:${col}">${done?icon.check():''}</span>${last?'':'<span class="stem"></span>'}</div>
      <div style="padding-top:2px;padding-bottom:12px"><div style="font-weight:800;${done?'':'color:#8E8A78'}">${evLabel(e[0],t)}</div><div class="muted" style="font-size:13px">${done?`${t.mon(e[1])} · ${e[2]}`:t.notYet}</div></div></div>`}).join('')}
  </div>
  ${b.status==='estimate'?`<button class="big bluebtn" style="font-size:19px;height:54px" data-act="approve">${t.approveDemo}</button>`:''}
  ${b.status!=='paid'?`<button class="big ${b.status==='estimate'?'blackbtn':'bluebtn'}" style="font-size:19px;height:54px" data-act="remind">${icon.send('#fff')}${t.remind}</button>`:''}
  ${b.status!=='paid'&&!isEst(b)?`<button class="big ghost" data-act="cash">${t.markCash}</button>`:''}
</div>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}${tabs(t,'bills')}`}

function clients(t){
  const list=[['Brooks'],['Carter'],['Kim'],['Lee'],['Nguyen'],['Oak St Rentals',4],['Patel'],['Smith'],['The Hendersons']];
  return `
<div class="pad" style="padding-top:24px;gap:12px">
  <h1 class="h" style="font-size:32px">${t.clients.toUpperCase()}</h1>
  <button class="big bluebtn" style="font-size:19px;height:auto;min-height:60px;padding:8px;flex-direction:column;gap:0" data-act="go" data-v="signup"><span>+ ${t.invite}</span><span style="font-family:Barlow;font-size:12px;font-weight:600;letter-spacing:0">${t.inviteD}</span></button>
  ${S.newClient?`<div class="card row" style="border:2px solid var(--blue)"><div class="ico" style="border-radius:22px;background:var(--blue);color:#111111;font-family:'Barlow Condensed';font-weight:800;font-size:18px">${S.newClient.name[0]}</div><div style="flex:1"><div style="font-weight:800">${S.newClient.name}</div><div class="muted" style="font-size:13px">${methodName(S.newClient.method,t)}${S.newClient.auto?' · '+t.autopayTag:''}</div></div><span class="chip c-est">${t.newTag}</span></div>`:''}
  ${list.map(([n,props])=>{const bs=S.bills.filter(b=>b.client===n);const paid=bs.reduce((x,b)=>x+paidOf(b),0);const owe=bs.reduce((x,b)=>x+oweOf(b),0);
    return `<div class="card row"><div class="ico" style="border-radius:22px;background:${props?'var(--ink)':'var(--ice)'};color:${props?'#fff':'var(--blueD)'};font-family:'Barlow Condensed';font-weight:800;font-size:18px">${n.replace('The ','')[0]}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:800">${n}${props?` <span class="tag" style="margin-left:4px">${t.landlord}</span>`:''}</div><div class="muted" style="font-size:13px">${props?t.props(props)+' · ':''}${t.totalPaid}: ${money(paid)}</div></div>${owe?`<span class="chip c-wait">${t.owes} ${whole(owe)}</span>`:''}</div>`}).join('')}
</div>${tabs(t,'clients')}`}

function bill(t){return `
<div class="row" style="padding:16px 16px 4px 12px;gap:6px">
  <button data-act="go" data-v="today" aria-label="${t.back}" style="width:44px;height:44px;border:none;background:none">${icon.back}</button>
  <h1 class="h" style="font-size:28px">${t.newBill.toUpperCase()}</h1>
</div>
<div class="pad" style="padding-top:4px;gap:14px">
  <div class="card row"><div class="ico" style="border-radius:22px;background:var(--ink);color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:18px">${cur().ini}</div><div style="flex:1"><div class="muted" style="font-size:12px;font-weight:700">${t.billTo}</div><div style="font-weight:800">${cur().client}</div><div class="muted" style="font-size:13px">${t[cur().jobKey]}</div></div><button data-act="switchBill" style="border:none;background:none;color:#8A6500;font-weight:800;font-size:14px;min-height:44px">${t.change}</button></div>
  <div class="card between" style="padding:10px 14px"><div><div style="font-weight:800;font-size:15px">${t.labor}</div><div class="muted" style="font-size:13px">${t.hoursAt(RATE)}</div><div style="margin-top:6px">${rateChip(t)}</div></div>
    <div class="row" style="gap:10px"><div class="stepper"><button data-act="hrs" data-v="-1" aria-label="−">−</button><b>${S.hours}</b><button data-act="hrs" data-v="1" aria-label="+">+</button></div></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0;font-size:15px">${t.materials} <span class="muted" style="font-weight:600">· ${t.tapToggle}</span></h2>
    ${cur().mats.map(m=>`<button class="mat ${S.mats[m.id]?'on':''}" data-act="mat" data-v="${m.id}" aria-pressed="${!!S.mats[m.id]}"><span class="box">${S.mats[m.id]?icon.check():''}</span><span style="flex:1;font-weight:700;${S.mats[m.id]?'':'color:#8E8A78;text-decoration:line-through'}">${t[m.id]}</span><span class="h" style="font-size:18px">$${m.price}</span></button>`).join('')}
  </div>
  <div class="card" style="padding:10px 14px;display:flex;flex-direction:column;gap:10px">
    <div class="row"><div style="flex:1"><div style="font-weight:800;font-size:15px">${t.addPhotos}</div><div class="muted" style="font-size:13px">${t.addPhotosD}</div></div><button class="switch ${S.photos?'on':''}" role="switch" aria-checked="${S.photos}" aria-label="${t.addPhotos}" data-act="photos"><span></span></button></div>
    ${S.photos?`<div class="photos"><div class="photo">${photoSvg(false,cur().photo)}<span>${t.before}</span></div><div class="photo">${photoSvg(true,cur().photo)}<span>${t.after}</span></div></div>`:''}
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:6px">
    <div class="line"><span>${t.jobTotal}</span><b>${money(sub())}</b></div>
    ${cur().deposit?`<div class="line" style="color:#11643C"><span>${t.deposit}</span><b>−${money(cur().deposit)}</b></div>`:''}
  </div>
  <div style="display:flex;flex-direction:column;gap:6px"><label for="note" style="font-size:15px;font-weight:800">${t.note}</label><textarea id="note" rows="3">${t.noteText}</textarea></div>
</div>
<div class="foot"><div><div class="muted" style="font-size:13px;font-weight:700">${t.due}</div><div class="h" style="font-size:30px;line-height:1">${money(due())}</div></div>
  <button class="big bluebtn pulse" style="flex:1;height:56px;font-size:19px" data-act="send">${icon.send('#fff')}${t.textBill}</button></div>
${S.sent?`<div class="sheetWrap"><div class="sheet" role="dialog" aria-label="${t.sent}">${conf()}
  <div style="width:72px;height:72px;border-radius:36px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px var(--ice)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 L10 14"/><path d="M21 3 L14 21 L10 14 L3 10 Z"/></svg></div>
  <h2 class="h" style="font-size:32px">${t.sent.toUpperCase()}</h2><p class="muted" style="margin:0;font-size:16px">${t.sentMsg(money(due()),cur().client)}</p>
  <button class="big pulse blackbtn" style="font-size:19px;height:54px;margin-top:8px" data-act="go" data-v="client">${t.seeThem}</button>
  <button class="link" data-act="go" data-v="today">${t.back}</button></div></div>`:''}`}

function client(t){
  const items=[[`${t.labor} (${S.hours} hrs)`,S.hours*RATE],...cur().mats.filter(m=>S.mats[m.id]).map(m=>[t[m.id],m.price])];
  const methods=[['apple'],['google'],['card'],['bank']];
  return `
<div class="pad" style="padding-top:22px;gap:14px">
  <div class="row" style="gap:10px">${icon.logo}<div><div style="font-weight:800">${t.biz}</div><div class="muted" style="font-size:13px">${t.date}</div></div></div>
  <h1 class="h" style="font-size:36px">${t.doneH}</h1>
  ${S.photos?`<div class="photos"><div class="photo">${photoSvg(false,cur().photo)}<span>${t.before}</span></div><div class="photo">${photoSvg(true,cur().photo)}<span>${t.after}</span></div></div>`:''}
  <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
    <div class="tag">${t[cur().jobKey]}</div>
    ${items.map(([n,p])=>`<div class="line"><span>${n}</span><b>${money(p)}</b></div>`).join('')}
    <div style="border-top:2px dashed var(--line)"></div>
    <div class="line"><span>${t.subtotal}</span><b>${money(sub())}</b></div>
    ${cur().deposit?`<div class="line" style="color:#11643C"><span>${t.deposit}</span><b>−${money(cur().deposit)}</b></div>`:''}
  </div>
  <div class="between"><span style="font-weight:800;font-size:17px">${t.due}</span><span class="h" style="font-size:38px">${money(due())}</span></div>
  <div style="display:flex;flex-direction:column;gap:10px">

const C=Math.ceil;
function calcEst(){
  const e=S.est, d=e.dims, it=[];
  const add=(k,qty,price,arg)=>{if(qty>0)it.push({k,qty,price,arg})};
  let hrs=0, size='sq';
  if(e.type==='deck'){ // lawn mowing, per month
    const A=Math.max(1000,d.L||0), V=Math.max(1,Math.round(d.W||1)), per=Math.max(0.5,Math.round((A/9000+(e.edge?0.25:0))*4)/4);
    add('m_fuel',V,3.5); if(e.edge) add('m_line',1,12);
    hrs=per*V; e.area=A; e.per=per;
  } else if(e.type==='drywall'){ // mulch beds
    const A=Math.max(10,d.L||0), D=Math.max(1,d.H||3), yd=C(A*D/12/27*1.05);
    add('m_mulch',yd,42,D); add('m_deliv',1,65); add('m_preem',C(A/1000),22); if(e.fabric) add('m_fabric',C(A/300),34);
    hrs=yd*1+A/400; e.area=A;
  } else if(e.type==='paint'){ // sod
    const L=Math.max(1,d.L||0), W=Math.max(1,d.W||0), A=L*W;
    add('m_sod',C(A*1.05/450),285); add('m_starter',C(A/5000),38); if(e.prep) add('m_topsoil',C(A/300),45);
    hrs=A/120+(e.prep?A/400:0); e.area=A;
  } else { // leaf cleanup
    const A=Math.max(1000,d.Len||0), k=e.heavy?1.6:1;
    add('m_bagbox',C(A/5000*k),28); add('m_dump',C(A/10000*k),45);
    hrs=A/2000*k+0.5; e.area=A;
  }
  hrs=Math.round(hrs*2)/2;
  const mat=it.reduce((x,i)=>x+i.qty*i.price,0), mk=mat*e.markup/100, labor=hrs*RATE;
  return {it,hrs,mat,mk,labor,total:Math.round(mat+mk+labor),size};
}

function pfCalc(){
  const pf=S.pf, crew=S.emps.filter(e=>e.id!=='marcus'), W=4.33;
  const wages=crew.reduce((x,e)=>x+e.rate*(pf.hpw[e.id]??40),0), paid=crew.reduce((x,e)=>x+(pf.hpw[e.id]??40),0);
  const labMo=wages*(1+pf.burden/100)*W, billHrs=paid*Math.max(1,pf.bill)/100*W, ovT=pf.ovh.reduce((x,o)=>x+o[1],0);
  const L=billHrs?labMo/billHrs:0, O=billHrs?ovT/billHrs:0, B=L+O, C=pf.mg<100?B/(1-pf.mg/100):B;
  return {crew,labMo,billHrs,ovT,L,O,B,C};
}

  else if(a==='estCoat'){S.est.dims.coats=+v;}
  else if(a==='estMk'){S.est.markup=+v;}
  else if(a==='estPhoto'){S.est.reading=v;render();setTimeout(()=>{const g=PHOTOS[v];S.est.type=g.type;S.est.dims={...g.dims};Object.assign(S.est,g.flags);S.est.fromPhoto=v;S.est.reading=false;render();},1700);return;}
  else if(a==='sendEst'){const r=calcEst(),n=esc(S.est.client)||'Ramirez',id='est'+Date.now();
    S.bills.push({id,client:n,job:t['pt_'+S.est.type],d:15,amount:r.total,status:'estimate',ev:[['est',15,'4:30 PM']]});
    S.billId=id;S.screen='billDetail';toast(t.estSent(n));window.scrollTo(0,0);}
  else if(a==='copyMats'){const r=calcEst();const tsv=[['Qty','Item','Each','Total']].concat(r.it.map(i=>[i.qty,itemName(i,T.en),i.price.toFixed(2),(i.qty*i.price).toFixed(2)])).map(x=>x.join('\t')).join('\n');
    try{navigator.clipboard.writeText(tsv).then(()=>{toast(t.copiedMats);render()},()=>{toast(t.copyFail);render()});}catch(err){toast(t.copyFail);}}
  else if(a==='paySub'){const x=S.subs.find(y=>y.id===v);toast(t.paidSub(whole(x.owed),x.n));S.exp.push({v:x.n,cat:'c_sub',job:x.job?x.job.split(' — ')[0]:null,amt:x.owed,d:15,isNew:true});x.ytd+=x.owed;x.owed=0;}
  else if(a==='chatTab'){S.chat.tab=v;}
  else if(a==='openThread'){const C=S.chat;C.open=v;C.menu=null;C.tagOpen=false;C.draft='';C.draftTags=[];C.draftPhoto=false;C.threads.find(x=>x.id===v).unread=0;S.screen='thread';S.toast='';render();const el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;return;}
  else if(a==='resolveFlag'){const [tid,i]=v.split(':');const m=S.chat.threads.find(x=>x.id===tid).msgs[+i];m.flag.open=false;m.flag.res='marcus';}
  else if(a==='tagMenu'){S.chat.draft=(document.getElementById('msgIn')||{}).value||S.chat.draft;S.chat.tagOpen=!S.chat.tagOpen;}
  else if(a==='tag'){const C=S.chat;C.draftTags=C.draftTags.includes(v)?C.draftTags.filter(x=>x!==v):[...C.draftTags,v];}
  else if(a==='untag'){S.chat.draft=(document.getElementById('msgIn')||{}).value||S.chat.draft;S.chat.draftTags=S.chat.draftTags.filter(x=>x!==v);}
  else if(a==='dPhoto'){S.chat.draft=(document.getElementById('msgIn')||{}).value||S.chat.draft;S.chat.draftPhoto=!S.chat.draftPhoto;}
  else if(a==='msgMenu'){S.chat.menu=v===''||v===undefined?null:+v;}
  else if(a==='pinMsg'){const m=S.chat.threads.find(x=>x.id===S.chat.open).msgs[S.chat.menu];m.pinned=!m.pinned;S.chat.menu=null;}
  else if(a==='flagMsg'){const m=S.chat.threads.find(x=>x.id===S.chat.open).msgs[S.chat.menu];if(m.flag&&m.flag.open){m.flag.open=false;m.flag.res='marcus';}else m.flag={open:true,by:'marcus'};S.chat.menu=null;}
  else if(a==='sendMsg'){const C=S.chat, raw=((document.getElementById('msgIn')||{}).value||'').trim(), txt=esc(raw);
    if(!txt&&!C.draftPhoto) return;
    if(BAD.test(raw)){C.draft=raw;toast(t.cleanMsg);render();return;}
    const th=C.threads.find(x=>x.id===C.open), tags=[...C.draftTags];
    const body=(tags.length&&!tags.every(id=>txt.toLowerCase().includes('@'+pName(id).split(' ')[0].toLowerCase()))?tags.filter(id=>!txt.toLowerCase().includes('@'+pName(id).split(' ')[0].toLowerCase())).map(id=>'@'+pName(id).split(' ')[0]).join(' ')+' ':'')+txt;
    th.msgs.push({who:'marcus',txt:body,t:'Now',tags,photo:C.draftPhoto?{after:true,kind:th.id==='oak'?'wall':'heater'}:null});
    if(C.draftPhoto) toast(t.photoChecked);
    C.draft='';C.draftTags=[];C.draftPhoto=false;C.tagOpen=false;
    const rep=tags.find(id=>id!=='marcus');
    if(rep){const tid=th.id;setTimeout(()=>{const x=S.chat.threads.find(y=>y.id===tid);x.msgs.push({who:rep,txt:PEOPLE[rep].sub?T[lang].autoSub:T[lang].autoCrew,t:'Now',tags:[]});if(S.screen==='thread'&&S.chat.open===tid){render();const el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;}else x.unread++;},1800);}
    render();const el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;return;}
  else if(a==='openPf'){S.screen='bills';S.moneyTab='pf';S.sent=false;S.toast='';window.scrollTo(0,0);}
  else if(a==='moneyTab'){S.moneyTab=v;S.toast='';}
  else if(a==='rcptPick'){S.rc.reading=v;render();setTimeout(()=>{const r=RCPTS[v];S.rc={reading:null,key:v,draft:{v:r.v,cat:r.cat,job:r.job,amt:r.amt,tax:r.tax,d:r.d}};render();},1700);return;}
  else if(a==='rcptCat'){S.rc.draft.cat=v;}
  else if(a==='rcptJob'){S.rc.draft.job=v||null;}
  else if(a==='rcptSave'){const d=S.rc.draft;S.exp.push({v:d.v,cat:d.cat,job:d.job,amt:d.amt,d:d.d,isNew:true});S.rc={reading:null,draft:null,key:null};S.moneyTab='pnl';S.screen='bills';toast(t.savedR(money(d.amt)));window.scrollTo(0,0);}
  else if(a==='copyPnl'){const P=pnlData();const rows=[['P&L — November 2026',''],['Income',P.inc.toFixed(2)]].concat(CATS.filter(c=>P.byCat[c]).map(c=>['Expense: '+T.en[c],P.byCat[c].toFixed(2)]),[['Total expenses',P.out.toFixed(2)],['Net profit',P.net.toFixed(2)],['',''],['Date','Store','Category','Job','Amount']],S.exp.map(e=>['2026-11-'+String(e.d).padStart(2,'0'),e.v,T.en[e.cat],e.job||'',e.amt.toFixed(2)]));
    const tsv=rows.map(r=>r.join('\t')).join('\n');try{navigator.clipboard.writeText(tsv).then(()=>{toast(t.copiedPnl);render()},()=>{toast(t.copyFail);render()});}catch(err){toast(t.copyFail);}}
  else if(a==='reqSub'){const x=S.subs.find(y=>y.id===v);toast(t.reqSent(x.n));}
  else if(a==='copyTime'){
    const rows=[['Name','Role','Hours this week','Rate','Pay']].concat(S.emps.filter(e=>e.id!=='marcus').map(e=>[e.n,T.en[e.role]||e.role,e.wk.toFixed(2),e.rate.toFixed(2),(e.wk*e.rate).toFixed(2)]));
    const tsv=rows.map(r=>r.join('\t')).join('\n');
    try{navigator.clipboard.writeText(tsv).then(()=>{toast(t.copiedTime);render()},()=>{toast(t.copyFail);render()});}catch(err){toast(t.copyFail);}
  }
  else if(a==='pay'){S.method=v;const j=cb(); if(j){j.amount=sub();j.status='paid';j.method=v;j.ev.push(['paid',15,'3:24 PM']);} S.screen='clientPaid';window.scrollTo(0,0);}
  else if(a==='day'){S.day=+v;}
  else if(a==='suMethod'){S.suMethod=v;}
  else if(a==='suAuto'){S.suAuto=!S.suAuto;}
  else if(a==='join'){const n=(document.getElementById('suName')||{}).value||'Jordan Ellis';S.newClient={name:n.replace(/[<>&"]/g,'')||'Jordan Ellis',method:S.suMethod,auto:S.suAuto};S.screen='signupDone';window.scrollTo(0,0);}
  else if(a==='who'){S.who=v;}
  else if(a==='filter'){S.filter=v;}
  else if(a==='openBill'){S.billId=v;S.screen='billDetail';S.toast='';window.scrollTo(0,0);}
  else if(a==='remind'){const x=S.bills.find(y=>y.id===S.billId);x.ev.push(['reminder',15,'4:15 PM']);toast(`${t.reminded} ${x.client}`);}
  else if(a==='approve'){const x=S.bills.find(y=>y.id===S.billId);x.status='approved';x.ev.push(['approved',15,'4:16 PM']);}
  else if(a==='cash'){const x=S.bills.find(y=>y.id===S.billId);x.status='paid';x.method='cash';x.ev.push(['paid',15,'4:16 PM']);}
  else if(a==='toast'){toast(t[v]);}
  else if(a==='copy'){
    const rows=[['Client','Job','Date','Amount','Status','Paid on','Method']].concat(S.bills.map(x=>{const p=x.ev.find(e=>e[0]==='paid');
      return [x.client,x.job,'2026-11-'+x.d,x.amount.toFixed(2),x.status,p?('2026-11-'+p[1]+' '+p[2]):'',x.method||'']}));
    const tsv=rows.map(r=>r.join('\t')).join('\n');
    try{navigator.clipboard.writeText(tsv).then(()=>{toast(t.copied);render()},()=>{toast(t.copyFail);render()});}catch(err){toast(t.copyFail);}
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msgIn'){e.preventDefault();const b=document.querySelector('[data-act=sendMsg]');if(b)b.click();}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches&&el.matches('[data-pfk],[data-pfw],[data-pfh],[data-pfo]')){pfInput(el);return;}
  if(el.dataset.dim){S.est.dims[el.dataset.dim]=parseFloat(el.value)||0;const o=document.getElementById('estOut');if(o){const keep=document.activeElement;o.innerHTML=estOut(T[lang]);}}
  else if(el.hasAttribute('data-estclient')){S.est.client=el.value;}
});
render();
setInterval(()=>{if(!S.clock.on)return;document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=hms(Date.now()-S.clock.start));},1000);
</script>
</body>
